<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · TubePacks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
body{display:grid;place-items:center;padding:24px 16px}
.box{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:20px}
.box .pack{width:126px;height:178px;transform:rotate(-6deg);gap:0}
.box .pack:hover{transform:rotate(-6deg)}
.box h1{font-size:2.5rem;font-weight:800}
.box .sub{text-align:center;margin:-10px 0 0}
form{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:20px;
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
.switch{display:flex;border-bottom:2px solid var(--line)}
.switch button{flex:1;background:none;border:0;padding:9px;font-weight:700;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px}
.switch button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.err{color:var(--bad);font-weight:700;font-size:.9rem;min-height:1.2em;margin:0}
.facts{display:flex;gap:16px;color:var(--muted);font-size:.85rem;flex-wrap:wrap;justify-content:center}
.facts b{color:var(--ink)}
</style>
</head>
<body>
<main class="box">
  <div class="pack" aria-hidden="true"><span class="play"><i></i></span></div>
  <h1>TubePacks</h1>
  <p class="sub note">Ouvre un pack toutes les 10 minutes, collectionne les vidéos YouTube françaises,
     revends tes doublons à l'hôtel des ventes.</p>
  <form id="f" novalidate>
    <div class="switch" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-mode="login">Se connecter</button>
      <button type="button" role="tab" aria-selected="false" data-mode="register">Créer un compte</button>
    </div>
    <label class="field">Pseudo<input type="text" name="username" autocomplete="username" maxlength="24"></label>
    <label class="field">Mot de passe<input name="password" type="password" autocomplete="current-password">
      <span class="hint" id="pwHint" hidden>8 caractères minimum.</span></label>
    <label class="field" id="inviteRow" hidden>Code d'invitation<input type="text" name="invite" autocomplete="off"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" id="go" style="padding:12px">Se connecter</button>
  </form>
  <div class="facts" id="facts"></div>
</main>
<script src="/static/login.js"></script>
</body>
</html>
