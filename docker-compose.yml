services:
  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      INVITE_CODE: ${INVITE_CODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      MIN_VIEWS: ${MIN_VIEWS:-10000}
      ADMIN_USERS: ${ADMIN_USERS:-EIRBLAST}
      KOFI_URL: ${KOFI_URL:-https://ko-fi.com/eirblast}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      MIN_VIEWS: ${MIN_VIEWS:-10000}
      CYCLE_PAUSE: ${CYCLE_PAUSE:-60}
      REFRESH_DAYS: ${REFRESH_DAYS:-7}
      DISCOVER: ${DISCOVER:-1}
      MIN_SECONDS: ${MIN_SECONDS:-60}
      API_WORKERS: ${API_WORKERS:-4}
      DETAILS_PER_CYCLE: ${DETAILS_PER_CYCLE:-120}
      ENRICH_PER_CYCLE: ${ENRICH_PER_CYCLE:-60}
      KEYWORDS_PER_CYCLE: ${KEYWORDS_PER_CYCLE:-6}
      SEARCH_PAGES: ${SEARCH_PAGES:-3}
      CHANNELS_PER_CYCLE: ${CHANNELS_PER_CYCLE:-30}
      RELATED_PER_CYCLE: ${RELATED_PER_CYCLE:-60}
      INVIDIOUS_INSTANCES: ${INVIDIOUS_INSTANCES:-}
      PIPED_INSTANCES: ${PIPED_INSTANCES:-}
      USE_YTDLP: ${USE_YTDLP:-1}
      PER_SOURCE: ${PER_SOURCE:-30}
      PAUSE: ${PAUSE:-2}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
